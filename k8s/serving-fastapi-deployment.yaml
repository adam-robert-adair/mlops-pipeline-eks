apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-fastapi
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris-fastapi
  template:
    metadata:
      labels:
        app: iris-fastapi
    spec:
      containers:
        - name: app
          image: REPLACE_ECR_SERVING_IMAGE
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: iris-fastapi
  namespace: mlops
spec:
  selector:
    app: iris-fastapi
  ports:
    - name: http
      port: 80
      targetPort: 8080
